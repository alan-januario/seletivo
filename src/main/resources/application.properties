spring.application.name=seletivo



#server.servlet.contextPath=/app
server.messages.encoding=UTF-8
server.tomcat.uri-encoding=UTF-8
server.port=8081
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configurações de segurança JWT
jwt.secret=5d1ldmnO45gXLECOlz3iOeGqz7RCDcsZrfVCPPZxBUa4VFxOLol1IEi7JxBkojkeajIeRxAntpxD
jwt.expiration=300000
jwt.refresh-expiration=600000

# Configurações CORS
cors.allowed-origins=http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type
cors.exposed-headers=Authorization


# Configurações do Swagger UI e Configurações do SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/v3/api-docs
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.oauth.useBasicAuthenticationWithAccessCodeGrant=true
springdoc.swagger-ui.oauth.clientId=swagger-ui
springdoc.swagger-ui.oauth.clientSecret=swagger-ui-secret
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.configUrl=/v3/api-docs/swagger-config
springdoc.swagger-ui.custom-javascript=/js/swagger-ui-extension.js
springdoc.swagger-ui.persistAuthorization=true



# Habilitar logs detalhados para depuração
logging.level.org.springdoc=ERROR
logging.level.org.springframework.security=ERROR
logging.level.root=ERROR
logging.level.org.springframework=ERROR


# Configurações de paginação
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100


#spring.main.allow-bean-definition-overriding=true

# Configurações do banco de dados para desenvolvimento local
spring.datasource.url=jdbc:postgresql://localhost:5432/seletivo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do MinIO para desenvolvimento local
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=seletivo
minio.expiry=300


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Configurações existentes...

# Configurações para exibir SQL no console
# Configurações para exibir SQL e logs no console
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.use_sql_comments=true

# Configurações de log
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.seletivo=DEBUG
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=DEBUG

# Configuração para mostrar logs no console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n


spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


# Configuração de log em arquivo
#logging.file.name=logs/seletivo.log
#logging.file.max-size=10MB
#logging.file.max-history=10
#logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
